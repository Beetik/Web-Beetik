name: Deploy to EC2

on:
  push:
    branches:
      - PaginaWebIndex
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run check
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy public site to EC2
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            --exclude='.git/' \
            --exclude='.well-known/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            public/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/beetikmx/"
